name: docker-full 

on:
  release:
    types: [published]

jobs:
  push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t localhost:5000/jsreport-app:latest .
      - name: Tag Docker image for local registry
        run: docker tag jsreport:latest localhost:5001/jsreport:latest
      - name: Push Docker image to local registry
        run: docker push localhost:5001/jsreport:latest
      - uses: actions/checkout@v2   

